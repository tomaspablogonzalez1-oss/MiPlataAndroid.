.github/workflows/build.yml

name: Build Mi Plata APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MiPlataAndroid_proyecto.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Instalar herramientas Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto
        run: unzip -o MiPlataAndroid_proyecto.zip -d .

      - name: Compilar APK
        run: gradle -p MiPlataAndroid assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MiPlata-APK
          path: MiPlataAndroid/app/build/outputs/apk/debug/app-debug.apk
